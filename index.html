<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TRAFCOMS · Unified Platform</title>
<script>(function(){try{var t=localStorage.getItem('trafcoms-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}})();</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A2A7A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRAFCOMS">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="royal.css">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="cameras.css">
<link rel="stylesheet" href="nav-shell.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="loginScreen" style="display:none">
  <main class="lg-card">
    <img class="lg-logo" src="icons/icon-192.png" alt="TRAFCOMS" style="width:96px">
    <div class="login-form-title" style="text-align:center;margin-bottom:6px">TRAFCOMS</div>
    <p class="sub" style="text-align:center;margin-bottom:22px">Unified operating record · Kenya Maritime Authority</p>
    <div class="login-field"><label for="lr">Sign in as</label><select id="lr"></select></div>
    <div class="login-field" id="lctx"></div>
    <p class="sub" id="lblurb" style="margin-bottom:6px"></p>
    <button class="login-btn" type="button" data-a="login"><span>Continue</span></button>
    <div class="login-error" id="loginError" role="alert" aria-live="polite"></div>
    <p class="sub" style="text-align:center;margin-top:14px">Demo mode: no password yet. Data stays in this browser.</p>
  </main>
</div>

<div class="shell" id="shell" style="display:none">
  <div class="admin-rail" id="adminRail">
    <div class="admin-rail-left">
      <div class="rail-brand">
        <span class="brand-tile rail-logo"><img src="icons/icon-192.png" alt="TRAFCOMS"></span>
        <span class="rail-brand-text"><span class="rail-brand-name">TRAFCOMS</span><span class="rail-brand-sub">Unified platform</span></span>
      </div>
    </div>
    <div class="admin-rail-right">
      <div class="rail-live"><div class="live-dot"></div><div class="rail-clock" id="liveTime">--:--</div><div class="rail-tz">EAT</div></div>
      <button class="rail-theme-btn" data-a="theme" title="Toggle light / dark mode" id="themeBtn">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <button class="rail-alert-btn" data-a="alerts" title="Alerts" id="alertBtn">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <div class="alert-dot" id="alertDot" style="display:none"></div>
      </button>
      <div class="user-chip-rail" data-a="usermenu">
        <div class="user-av-rail" id="railUserAv">--</div>
        <div class="user-info-rail"><div class="user-name-rail" id="railUserName"></div><div class="user-role-rail" id="railUserRole"></div></div>
      </div>
      <div class="user-menu" id="userMenu" style="display:none">
        <div class="user-menu-header" id="userMenuHeader"></div>
        <div class="user-menu-divider"></div>
        <div class="user-menu-item" data-a="resetdemo">Reset demo data</div>
        <div class="user-menu-item danger" data-a="out">Sign Out</div>
      </div>
    </div>
  </div>

  <div class="body-wrap">
    <div class="sidebar-backdrop" id="sidebarBackdrop" data-a="sidebar"></div>
    <aside class="sidebar" id="sidebar">
      <div class="dock-mark"><span class="brand-tile"><img src="icons/icon-192.png" alt="TRAFCOMS"></span></div>
      <div class="sidebar-section-head"><div class="sidebar-section-label" id="sbLabel"></div></div>
      <nav class="sidebar-nav" id="sbNav"></nav>
      <div class="sidebar-footer"><div class="sidebar-footer-label">TRAFCOMS · v1.0</div><div class="sidebar-footer-status"><div class="live-dot"></div><span>System live</span></div></div>
    </aside>

    <main class="main">
      <div class="section-topbar" id="sectionTopbar">
        <div class="section-topbar-left">
          <button class="hamburger" data-a="sidebar" aria-label="Menu"><span></span><span></span><span></span></button>
          <div class="section-breadcrumb"><span class="breadcrumb-area" id="topbarArea"></span>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"><polyline points="9 18 15 12 9 6"/></svg>
            <span class="breadcrumb-title" id="topbarTitle"></span></div>
        </div>
        <div class="section-topbar-right">
          <div class="sync-status synced"><span class="sync-dot"></span><span>Saved on this device</span></div>
          <div class="topbar-date" id="todayDate"></div>
          <div class="role-chip" id="topbarRoleChip"></div>
        </div>
      </div>
      <div class="alerts-panel" id="alertsPanel">
        <div class="alerts-title">Active Alerts <button class="alert-close-btn" data-a="alerts">✕</button></div>
        <div id="alertsList"></div>
      </div>
      <div class="content"><section class="section active" id="sec"><div class="sec-toolbar"><div class="sec-title" id="secTitle"></div><div class="filter-row" id="secActs"></div></div><div id="v"></div></section></div>
    </main>
  </div>
</div>

<div class="modal-backdrop" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-hdr"><div class="modal-title" id="modalTitle">Details</div><button class="modal-close" data-a="closemodal">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div id="toastStack"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
